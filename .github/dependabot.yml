version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '10:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - '*'
    # Major upgrades require a separate, deliberate review.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '10:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
