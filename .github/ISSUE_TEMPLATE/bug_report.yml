name: Bug report
description: Report reproducible behavior in MarginCarry.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. This report is public: do not upload private PDFs, Zotero profiles/databases, full transfer journals, or unredacted logs. For vulnerabilities, follow SECURITY.md instead.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include MarginCarry, Zotero, operating system version, and CPU architecture.
      placeholder: MarginCarry 0.2.0; Zotero 10.0.7; macOS 15.7.9; Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include annotation type, PDF revision relationship, page rotation, and relevant actions. Use a synthetic example when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error message, if any. Redact document text, comments, paths, and identifiers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional sanitized evidence
      description: Screenshots, minimal synthetic PDFs you may publish, or a short log excerpt. State which checks you performed.
